<h2>第 5 题</h2>
<p>肺炎支原体是一类会引发肺炎的病原体，通过电子显微镜观察其细胞结构，可以确定肺炎支原体是原核生物。作出该判断的主要依据是其( )
A. 没有核膜B. 有细胞膜C. 有线粒体D. 有细胞壁</p>
<h3>我的答案</h3>
<p>A</p>
<h3>参考答案</h3>
<p>A</p>
<h3>知识点</h3>
<p>真核细胞和原核细胞的异同</p>
<h3>题目解析</h3>
<p>略</p>
<p>（页面底部：满意 / 不满意）</p>
