# 准入清单 v1.2（S1 固化件）
# 版本：v1.2（2026-10-28，SPEC-011：增"错因复核件"可选项；required 不变，向后兼容）｜ 承载：SPEC-003/SPEC-004/SPEC-005/SPEC-011 / 契约 §4
# 判定方式：文件名正则匹配（容忍命名差异），由 convert.js --check 执行并输出缺项报告。

required:                     # 缺一即 S1 不通过（可显式豁免，豁免理由入 exam.json integrity.checks）
  - name: 总分概览
    pattern: "总分概览"
    min: 1
  - name: 各科成绩概览        # 题级表与 L1 分数/等级的出处
    pattern: "(语文|数学|英语|物理|化学|生物|政治|历史|地理)[-－]成绩概览"
    per_subject: true
    min_per_subject: 1

optional:                     # 有则入档对应层，无则按兼容矩阵降级（不视为缺陷）
  - name: 知识点掌握情况
    pattern: "(数学|生物)[-－]知识点掌握情况[-－]?\\d*"
    layer: L3
  - name: 试卷解析逐页
    pattern: "(数学|生物)[-－]试卷解析 \\(\\d+\\)"
    layer: L4
  - name: 作答原卷
    pattern: "(语文作答原卷|(数学|英语|物理|化学|生物|政治|历史)[-－]作答原卷[上下]?)"
    layer: L5                  # L5 不入分析（SPEC-002 §三），仅档案
  - name: 等级与指标说明
    pattern: "(等级说明|说明)"
    layer: meta
  - name: 各科成绩概览·年级视图      # v1.1 新增（SPEC-005）：年级均分/排名真实来源，替代不可行的"等级反推"
    pattern: "(语文|数学|英语|物理|化学|生物|政治|历史|地理)[-－]成绩概览[-－]?年级"
    layer: L1-grade
    note: 有则转换器提取 avgGrade/rank/rankSize；无则该列显示"–"，禁止估算
  - name: 仪表盘裁剪件                # v1.1 新增：站点弹层"仪表盘"页素材（S3.6 产物，命名约定见契约）
    pattern: "data/assets/(总分|语文|数学|英语|物理|化学|生物|政治|历史|地理)-仪表盘\\.png$"
    layer: ui
  - name: 错因复核件                  # v1.2 新增（SPEC-011）：AI 预判+人工确认，仅确认行回填 cause（CAUSE-TAXONOMY v1 §四）
    pattern: "md\\.错因复核[-－](数学|生物|语文|英语|物理|化学|政治|历史|地理)"
    layer: L6-cause
    note: 有则转换器回填已确认行的 cause/causeNote；无则该科错因覆盖 integrity 报 warn"待复核"

naming_tolerance:             # 已实证的命名差异 → 科目归属（新增差异须升版补录）
  生物学: biology
  生物: biology
  语文作答原卷: 语文-作答原卷

volume_hints:                 # 预期量级参考（±异常时报 warn，不阻断）
  raw_images_min: 20           # 9 科概览+总分起步
  md_files_equals_raw: true    # SPEC-000 AC1 恒等式
