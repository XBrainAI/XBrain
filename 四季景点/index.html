<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>四季景点 — XBrain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --xb-deep: #0a0a1a;
      --xb-mid: #1a1030;
      --xb-light: #2d1b4e;
      --xb-accent: #64b4ff;
      --xb-accent2: #80c0ff;
      --xb-glow: rgba(100, 180, 255, 0.35);
      --xb-border: rgba(100, 180, 255, 0.2);
      --xb-text: #e8ecf4;
      --xb-text-dim: rgba(200, 210, 230, 0.6);
      --xb-gold: #d4a853;
      --xb-ok: #5fd39a;
      --xb-warn: #ffb45f;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--xb-deep);
      color: var(--xb-text);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== XBrain Brand Logo (Fixed) ===== */
    .xbrain-brand {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(20, 15, 50, 0.94) 0%, rgba(40, 30, 80, 0.92) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(180, 210, 255, 0.55);
      border-radius: 12px;
      padding: 6px 14px 6px 8px;
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.15),
        0 0 40px rgba(80, 140, 255, 0.35),
        0 4px 20px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-decoration: none;
      transition: opacity 0.6s ease, box-shadow 0.6s ease, border-color 0.6s ease;
    }

    .xbrain-brand:hover {
      box-shadow:
        0 0 24px rgba(80, 140, 255, 0.40),
        0 4px 20px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
      border-color: rgba(180, 210, 255, 0.70);
    }

    .xbrain-brand.scrolled {
      background: rgba(15, 10, 40, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-color: rgba(100, 180, 255, 0.08);
      box-shadow: none;
    }

    .xbrain-brand svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 12px rgba(100, 180, 255, 0.55));
    }

    .xbrain-brand .xbrain-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #e8ecf4;
      line-height: 1;
      text-shadow: 0 0 12px rgba(100, 180, 255, 0.55);
    }

    .xbrain-brand .xbrain-text span {
      color: #64b4ff;
      text-shadow: 0 0 18px rgba(100, 180, 255, 0.9);
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 52vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 1.5rem;
    }

    .hero-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 0.8rem;
    }

    .hero-title span {
      color: var(--xb-accent);
      text-shadow: 0 0 30px rgba(100, 180, 255, 0.5);
    }

    .hero-subtitle {
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 300;
      color: var(--xb-text-dim);
      letter-spacing: 4px;
      margin-bottom: 1.2rem;
    }

    .hero-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--xb-accent), transparent);
      margin: 0 auto 1.4rem;
    }

    /* ===== STATS ===== */
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .stat {
      min-width: 92px;
      padding: 0.7rem 1.1rem;
      border: 1px solid var(--xb-border);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(20, 20, 50, 0.5), rgba(30, 20, 60, 0.4));
      backdrop-filter: blur(8px);
    }

    .stat b {
      display: block;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--xb-accent);
      line-height: 1.1;
    }

    .stat span {
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: var(--xb-text-dim);
    }

    /* ===== TOOLBAR ===== */
    .toolbar {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 1.5rem auto 0;
      padding: 1rem 1.2rem;
      background: linear-gradient(135deg, rgba(20, 20, 50, 0.55), rgba(30, 20, 60, 0.45));
      border: 1px solid var(--xb-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.8rem;
    }

    .toolbar-row:last-child {
      margin-bottom: 0;
    }

    .search-box {
      flex: 1 1 240px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      background: rgba(10, 10, 26, 0.6);
      border: 1px solid var(--xb-border);
      border-radius: 10px;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: var(--xb-text-dim);
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--xb-text);
      font-size: 0.9rem;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--xb-text-dim);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--xb-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--xb-text-dim);
      padding: 0.55rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .view-toggle button.active {
      background: var(--xb-accent);
      color: var(--xb-deep);
      font-weight: 700;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-label {
      font-size: 0.74rem;
      letter-spacing: 1px;
      color: var(--xb-text-dim);
      margin-right: 0.1rem;
    }

    .chip {
      padding: 0.36rem 0.85rem;
      border: 1px solid var(--xb-border);
      border-radius: 999px;
      background: rgba(10, 10, 26, 0.4);
      color: var(--xb-text-dim);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .chip:hover {
      color: var(--xb-text);
      border-color: rgba(100, 180, 255, 0.45);
    }

    .chip.active {
      background: rgba(100, 180, 255, 0.16);
      border-color: var(--xb-accent);
      color: var(--xb-accent);
      font-weight: 600;
    }

    .chip .cnt {
      opacity: 0.6;
      font-size: 0.7rem;
      margin-left: 0.25rem;
    }

    /* ===== SITES GRID (cards) ===== */
    .sites-section {
      position: relative;
      z-index: 1;
      padding: 1.6rem 2rem 2rem;
      max-width: 1240px;
      margin: 0 auto;
    }

    .empty-tip {
      text-align: center;
      color: var(--xb-text-dim);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    /* 卡片视图 = 垂直时间线信息流（朋友圈风格）：单列窄信息流，左侧竖线串联 */
    .sites-grid {
      display: block;
      max-width: 720px;
      margin: 0 auto;
    }

    .site-card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(20, 20, 50, 0.6) 0%, rgba(30, 20, 60, 0.5) 100%);
      border: 1px solid var(--xb-border);
      backdrop-filter: blur(10px);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .site-card:hover {
      border-color: rgba(100, 180, 255, 0.5);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(100, 180, 255, 0.15);
    }

    .site-card-image {
      width: 100%;
      height: 190px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .site-card-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 0%, rgba(10, 10, 26, 0.92) 100%);
    }

    .site-card-image.empty {
      background: transparent;
    }

    .badge {
      position: absolute;
      top: 0.9rem;
      left: 0.9rem;
      z-index: 3;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 1px;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .badge.status-pub {
      background: rgba(95, 211, 154, 0.18);
      border: 1px solid var(--xb-ok);
      color: var(--xb-ok);
    }

    .badge.status-draft {
      background: rgba(255, 180, 95, 0.18);
      border: 1px solid var(--xb-warn);
      color: var(--xb-warn);
    }

    .site-card-content {
      padding: 1.2rem 1.3rem 1.4rem;
      position: relative;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.7rem;
    }

    .tag {
      display: inline-block;
      padding: 0.16rem 0.6rem;
      border-radius: 4px;
      font-size: 0.68rem;
      letter-spacing: 0.5px;
    }

    .tag.region {
      border: 1px solid var(--xb-accent);
      color: var(--xb-accent);
    }

    .tag.theme {
      border: 1px solid rgba(212, 168, 83, 0.6);
      color: var(--xb-gold);
    }

    .tag.type {
      border: 1px solid rgba(200, 210, 230, 0.4);
      color: var(--xb-text-dim);
    }

    .site-card h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.22rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
      color: var(--xb-text);
    }

    .site-card p {
      font-size: 0.84rem;
      color: var(--xb-text-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--xb-text-dim);
    }

    .site-card-arrow {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--xb-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--xb-accent);
      transition: all 0.3s ease;
    }

    .site-card:hover .site-card-arrow {
      background: var(--xb-accent);
      color: var(--xb-deep);
      border-color: var(--xb-accent);
    }

    /* draft card CTA */
    .draft-card {
      cursor: default;
    }

    .draft-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.9rem;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      background: rgba(255, 180, 95, 0.14);
      border: 1px solid var(--xb-warn);
      color: var(--xb-warn);
      font-size: 0.78rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .draft-cta:hover {
      background: var(--xb-warn);
      color: var(--xb-deep);
      font-weight: 600;
    }

    /* ===== MANAGE TABLE ===== */
    .manage-section {
      position: relative;
      z-index: 1;
      padding: 1.6rem 2rem 2rem;
      max-width: 1240px;
      margin: 0 auto;
      display: none;
    }

    .manage-section.show {
      display: block;
    }

    .manage-wrap {
      overflow-x: auto;
      border: 1px solid var(--xb-border);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(20, 20, 50, 0.5), rgba(30, 20, 60, 0.4));
    }

    table.manage {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 780px;
    }

    table.manage th,
    table.manage td {
      padding: 0.7rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid rgba(100, 180, 255, 0.1);
      white-space: nowrap;
    }

    table.manage th {
      color: var(--xb-text-dim);
      font-weight: 600;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      background: rgba(15, 12, 38, 0.96);
      backdrop-filter: blur(6px);
      cursor: pointer;
      user-select: none;
    }

    table.manage th:hover {
      color: var(--xb-accent);
    }

    table.manage td.name {
      font-weight: 600;
      color: var(--xb-text);
    }

    table.manage tr:hover td {
      background: rgba(100, 180, 255, 0.05);
    }

    .mini-badge {
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .mini-badge.pub {
      background: rgba(95, 211, 154, 0.16);
      color: var(--xb-ok);
    }

    .mini-badge.draft {
      background: rgba(255, 180, 95, 0.16);
      color: var(--xb-warn);
    }

    .row-link {
      color: var(--xb-accent);
      text-decoration: none;
      font-size: 0.8rem;
    }

    .row-link:hover {
      text-decoration: underline;
    }

    .row-link.disabled {
      color: var(--xb-text-dim);
      pointer-events: none;
    }

    /* ===== DRAFT / TEMPLATE PANELS ===== */
    .panel-section {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 2rem 0;
    }

    .panel {
      border: 1px dashed rgba(255, 180, 95, 0.4);
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      background: rgba(255, 180, 95, 0.04);
      margin-bottom: 1.2rem;
    }

    .panel.tpl {
      border-color: rgba(100, 180, 255, 0.4);
      background: rgba(100, 180, 255, 0.04);
    }

    .panel h4 {
      font-size: 0.95rem;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
      color: var(--xb-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel h4 .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--xb-warn);
    }

    .panel.tpl h4 .dot {
      background: var(--xb-accent);
    }

    .panel p {
      font-size: 0.82rem;
      color: var(--xb-text-dim);
      line-height: 1.6;
      margin-bottom: 0.7rem;
    }

    .panel-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .panel-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--xb-border);
      color: var(--xb-accent);
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .panel-links a:hover {
      background: rgba(100, 180, 255, 0.12);
      border-color: var(--xb-accent);
    }

    .draft-inline {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.2rem;
      font-size: 0.8rem;
      color: var(--xb-text-dim);
    }

    .draft-inline b {
      color: var(--xb-warn);
    }

    /* ===== BACK / FOOTER ===== */
    .back-link {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1.5rem auto 0;
      padding: 0.6rem 1.2rem;
      color: var(--xb-accent);
      text-decoration: none;
      border: 1px solid var(--xb-border);
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: rgba(100, 180, 255, 0.1);
      border-color: var(--xb-accent);
    }

    .center {
      text-align: center;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem 2rem;
      color: var(--xb-text-dim);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    footer .footer-line {
      width: 30px;
      height: 1px;
      background: var(--xb-border);
      margin: 0 auto 1rem;
    }

    footer .footer-version {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.25);
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    /* ===== 卡片节点（垂直时间线 + 朋友圈式节点卡片） ===== */
    .site-card-wrap {
      position: relative;
      padding-left: 34px;
      padding-top: 34px;
      margin-bottom: 1.8rem;
      border-left: 2px solid var(--xb-border);
      opacity: 0;
      transform: translateY(30px);
    }

    .site-card-wrap:last-child {
      border-left-color: transparent;
      margin-bottom: 0.4rem;
    }

    .site-card-wrap.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 节点圆点（骑在竖线上，与顶部时间标签对齐） */
    .tl-dot {
      position: absolute;
      left: -7px;
      top: 5px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--xb-accent);
      border: 2px solid var(--xb-deep);
      box-shadow: 0 0 10px var(--xb-glow);
      z-index: 2;
    }

    /* 未实现节点圆点（琥珀色，区别于已实现） */
    .tl-dot.tl-dot-draft {
      background: var(--xb-warn);
      box-shadow: 0 0 10px rgba(255, 180, 95, 0.6);
    }

    /* 节点旁的具体时间标签（顶部时间头部，紧贴圆点右侧，卡片在其下方） */
    .tl-time {
      position: absolute;
      left: 17px;
      top: 1px;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--xb-accent);
      background: rgba(10, 10, 26, 0.55);
      border: 1px solid var(--xb-border);
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 2;
    }

    .tl-time.tl-time-missing,
    .tl-time.tl-time-draft {
      color: var(--xb-warn);
      background: rgba(255, 180, 95, 0.1);
      border-color: rgba(255, 180, 95, 0.5);
    }

    /* 卡片顶部日期徽标（朋友圈式时间标记） */
    .tl-date-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.72rem;
      color: var(--xb-accent);
      background: rgba(100, 180, 255, 0.1);
      border: 1px solid var(--xb-border);
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }

    /* 出行日期缺失（待补）徽标 */
    .tl-date-badge.tl-date-missing {
      color: var(--xb-warn);
      background: rgba(255, 180, 95, 0.12);
      border-color: rgba(255, 180, 95, 0.5);
    }

    /* 次级：整理日期（副标） */
    .tl-sub {
      font-size: 0.68rem;
      color: var(--xb-text-dim);
      letter-spacing: 0.4px;
      margin-bottom: 0.5rem;
    }

    /* 时间轴为空（仅筛选到草稿时）提示 */
    .timeline-empty {
      text-align: center;
      color: var(--xb-text-dim);
      font-size: 0.85rem;
      line-height: 1.7;
      padding: 2rem 1.2rem;
      border: 1px dashed var(--xb-border);
      border-radius: 12px;
    }

    .muted {
      color: var(--xb-text-dim);
      font-size: 0.72rem;
      font-weight: 400;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .hero-title {
        letter-spacing: 2px;
      }

      .sites-section,
      .manage-section,
      .panel-section {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .toolbar {

            var da = a.date || '', db = b.date || '';
            var c = da > db ? -1 : da < db ? 1 : 0;
            if (c === 0) c = a.updated > b.updated ? -1 : a.updated < b.updated ? 1 : 0;
            if (c !== 0) return c; // 出行时间倒序（晚→早），最新在最上层
            return a.name.localeCompare(b.name, 'zh');
          });
          // 出行日期缺失（待补）的条目统一沉到时间轴末尾，不挤占真实出行轨迹的位置
          var missing = list.filter(function (s) { return !s.date; });
          var dated = list.filter(function (s) { return !!s.date; });
          list.length = 0;
          Array.prototype.push.apply(list, dated.concat(missing));
        }
        return list;
      }

      var arrowSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';

      // 首图规则：采用子站目录下的 index.html.<图片扩展名> 文件；无则留空（不显示占位图）
      function coverHtml(s) {
        if (s.cover) {
          return '<div class="site-card-image" style="background-image:url(\'./' + s.cover + '\')"></div>';
        }
        return '<div class="site-card-image empty"></div>';
      }

      // 时间轴卡片内容（已实现 / 未实现 通用；出行日期缺失时标注「待补」）
      function cardInner(s) {
        var isDraft = s.status === 'draft';
        var isDone = !!s.hasLog;
        var badge = isDone
          ? '<span class="badge status-pub">已实现</span>'
          : '<span class="badge status-draft">未实现</span>';
        var dateBadge = s.date
          ? '<div class="tl-date-badge">出行于 ' + s.date + '</div>'
          : '<div class="tl-date-badge tl-date-missing">出行日期待补</div>';
        var sub = '<div class="tl-sub">整理于 ' + (s.updated || '') + '</div>';
        var tags = '<span class="tag region">' + s.regionTag + '</span>' +
          '<span class="tag theme">' + s.theme + '</span>' +
          '<span class="tag type">' + (s.type === '攻略' ? '攻略规划' : '纯游记') + '</span>';
        var meta = isDraft
          ? '<a class="draft-cta" href="./src/site-template-travelogue.html"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>用纯游记模板补建</a>'
          : '<div class="card-meta"><span>更新 ' + s.updated + '</span><span class="site-card-arrow">' + arrowSvg + '</span></div>';
        return badge + coverHtml(s) +
          '<div class="site-card-content">' + dateBadge + sub + tags +
          '<h3>' + s.title + '</h3>' +
          '<p>' + s.desc + '</p>' +
          meta +
          '</div>';
      }

      function timelineItem(s) {
        // 节点旁时间标签：已实现(有游记)显示出行时间（缺失标「待补」），未实现(无游记)显示更新时间
        var nodeTime, nodeCls;
        if (s.hasLog) {
          if (s.date) { nodeTime = s.date; nodeCls = ''; }
          else { nodeTime = '待补'; nodeCls = ' tl-time-missing'; }
        } else {
          nodeTime = s.updated || '—';
          nodeCls = ' tl-time-draft';
        }
        var timeTag = '<div class="tl-time' + nodeCls + '">' + nodeTime + '</div>';
        if (s.status === 'draft') {
          return '<div class="site-card-wrap">' + timeTag + '<div class="tl-dot tl-dot-draft"></div>' +
            '<div class="site-card draft-card">' + cardInner(s) + '</div></div>';
        }
        return '<div class="site-card-wrap">' + timeTag + '<div class="tl-dot' + (s.hasLog ? '' : ' tl-dot-draft') + '"></div>' +
          '<a class="site-card" href="./' + s.name + '/index.html">' + cardInner(s) + '</a></div>';
      }

      function rowHtml(s) {
        var badge = s.hasLog
          ? '<span class="mini-badge pub">已实现</span>'
          : '<span class="mini-badge draft">未实现</span>';
        var link = s.status === 'published'
          ? '<a class="row-link" href="./' + s.name + '/index.html">打开 ↗</a>'
          : '<span class="row-link disabled">待建</span>';
        return '<tr>' +
          '<td class="name">' + s.title + '</td>' +
          '<td>' + s.regionTag + '</td>' +
          '<td>' + s.theme + '</td>' +
          '<td>' + (s.type === '攻略' ? '攻略规划' : '纯游记') + '</td>' +
          '<td>' + badge + '</td>' +
          '<td><b>' + (s.date ? s.date : '待补') + '</b><br><span class="muted">整理 ' + s.updated + '</span></td>' +
          '<td>' + link + '</td>' +
          '</tr>';
      }

      function render() {
        var list = getFiltered();
        // 时间轴仅渲染当前选中「状态」的子站（已实现 / 未实现），排序轴由 getFiltered 依据状态决定。
        els.grid.innerHTML = list.map(timelineItem).join('');
        els.manageBody.innerHTML = list.map(rowHtml).join('');
        els.emptyTip.style.display = list.length ? 'none' : 'block';
        if (currentView === 'cards') {
          revealItems(els.grid);
        }
      }

      // ===== 草稿内联提示 =====
      function renderDraftInline() {
        var drafts = SITES.filter(function (s) { return s.status === 'draft'; });
        if (!drafts.length) { els.draftInline.innerHTML = '暂无草稿子站。'; return; }
        els.draftInline.innerHTML = drafts.map(function (s) {
          return '<span>· <b>' + s.title + '</b>（' + s.regionTag + '·' + s.theme + '）</span>';
        }).join('');
      }

      // ===== 视图切换 =====
      document.getElementById('viewToggle').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var view = btn.getAttribute('data-view');
        currentView = view;
        document.querySelectorAll('#viewToggle button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var isManage = view === 'manage';
        els.manageSection.classList.toggle('show', isManage);
        document.querySelector('.sites-section').style.display = isManage ? 'none' : 'block';
      });

      // ===== 搜索 =====
      els.search.addEventListener('input', render);

      // ===== LOGO 滚动淡出 =====
      var logo = document.querySelector('.xbrain-brand');
      var ticking = false;
      function updateLogo() {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var ratio = Math.min(scrollY / vh, 1);
        var opacity = 1 - ratio * 0.7;
        if (logo) {
          logo.style.opacity = opacity;
          logo.classList.toggle('scrolled', scrollY > vh * 0.3);
        }
      }
      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(function () { updateLogo(); ticking = false; });
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('touchmove', function () {
        if (!ticking) {
          window.requestAnimationFrame(function () { updateLogo(); ticking = false; });
          ticking = true;
        }
      }, { passive: true });
      updateLogo();

      // ===== 入场动画（卡片 / 时间轴通用） =====
      var revealObserver;
      function revealItems(container) {
        if (!revealObserver) {
          revealObserver = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                var el = entry.target;
                setTimeout(function () { el.classList.add('visible'); }, (parseInt(el.dataset.i || '0', 10)) * 60);
                revealObserver.unobserve(el);
              }
            });
          }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        }
        var targets = container.querySelectorAll('.site-card-wrap');
        Array.prototype.forEach.call(targets, function (c, i) {
          c.dataset.i = i % 12;
          c.classList.remove('visible');
          revealObserver.observe(c);
        });
      }

      // ===== 初始化 =====
      renderStats();
      syncChips();
      renderDraftInline();
      render();
    })();
  </script>

</body>
