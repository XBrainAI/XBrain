<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>健康 — XBrain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../brand/tokens.css">
  <link rel="stylesheet" href="../brand/brand.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 品牌层令牌由 ../brand/tokens.css 提供（SPEC-008 形态 B） */

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--xb-deep);
      color: var(--xb-text);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 3rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: var(--sp-4);
    }

    .hero-title span {
      text-shadow: 0 0 30px rgba(100, 180, 255, 0.5);
    }

    .hero-subtitle {
      font-size: clamp(var(--fs-sm), 1.8vw, var(--fs-md));
      font-weight: 300;
      color: var(--xb-text-dim);
      letter-spacing: 4px;
      margin-bottom: var(--sp-4);
    }

    .hero-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--xb-accent), transparent);
      margin: 0 auto;
    }

    /* ===== SITES GRID ===== */
    .sites-section {
      position: relative;
      z-index: 1;
      padding: 2rem 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .site-card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--xb-surface-1);
      border: 1px solid var(--skin-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) ease, border-color var(--dur-med) ease;
    }

    .site-card:hover {
      transform: translateY(-8px);
      border-color: rgba(100, 180, 255, 0.5);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(100, 180, 255, 0.15);
    }

    .site-card-image {
      width: 100%;
      height: 220px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .site-card-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 0%, rgba(10, 10, 26, 0.9) 100%);
    }

    .site-card-image.fallback {
      background: linear-gradient(135deg, #1a1030 0%, #2d1b4e 50%, #1a3a5c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-card-image.fallback::after {
      background: linear-gradient(to bottom, transparent 0%, rgba(10, 10, 26, 0.7) 100%);
    }

    .site-card-image.fallback svg {
      width: 80px;
      height: 80px;
      opacity: 0.3;
      filter: drop-shadow(0 0 20px rgba(100, 180, 255, 0.3));
    }

    .site-card-content {
      padding: var(--sp-4) var(--sp-5);
      position: relative;
    }

    .site-card-tag {
      display: inline-block;
      padding: var(--sp-1) var(--sp-3);
      border: 1px solid var(--skin-accent);
      color: var(--skin-accent);
      font-size: var(--fs-xs);
      letter-spacing: 2px;
      border-radius: var(--r-sm);
      margin-bottom: var(--sp-3);
    }

    .site-card h3 {
      font-family: var(--font-serif);
      font-size: var(--fs-lg);
      font-weight: 700;
      margin-bottom: var(--sp-2);
      color: var(--xb-text);
    }

    .site-card p {
      font-size: var(--fs-sm);
      color: var(--xb-text-dim);
      line-height: var(--lh-body);
    }

    .site-card-arrow {
      position: absolute;
      right: 1.5rem;
      bottom: 1.5rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--xb-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--xb-accent);
      transition: all 0.3s ease;
    }

    .site-card:hover .site-card-arrow {
      background: var(--xb-accent);
      color: var(--xb-deep);
      border-color: var(--xb-accent);
      box-shadow: 0 0 16px rgba(100, 180, 255, 0.4);
    }

    /* ===== FOOTER ===== */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      color: var(--xb-text-dim);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    footer .footer-line {
      width: 30px;
      height: 1px;
      background: var(--xb-border);
      margin: 0 auto 1rem;
    }

    /* ===== BACK BUTTON ===== */
    .back-link {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      margin: var(--sp-5) auto 0;
      padding: var(--sp-2) var(--sp-4);
      min-height: var(--tap-size);
      color: var(--skin-accent);
      text-decoration: none;
      font-size: var(--fs-sm);
      border: 1px solid var(--skin-border);
      border-radius: var(--r-md);
      transition: all var(--dur-fast) ease;
    }

    .back-link:hover {
      background: rgba(100, 180, 255, 0.1);
      border-color: var(--skin-accent);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .sites-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .hero-title {
        letter-spacing: 2px;
      }

      .sites-section {
        padding: 2rem 1rem 3rem;
      }
    }
  </style>
</head>

<body>

  <!-- ===== XBrain Brand Logo (Fixed) ===== -->
  <a class="xbrain-brand" href="../index.html" title="XBrain">
    <svg viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#64b4ff" stop-opacity="1" />
          <stop offset="60%" stop-color="#3a7bd5" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#1a2a5e" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#80c0ff" />
          <stop offset="50%" stop-color="#4a90e2" />
          <stop offset="100%" stop-color="#80c0ff" />
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <circle class="xb-glow-bg" cx="176" cy="180" r="170" fill="url(#coreGlow)" opacity="0.12" />
      <circle class="xb-ring" cx="176" cy="180" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="2"
        opacity="0.55" filter="url(#glow)" />
      <g transform="matrix(0 -1 1 0 30 300)">
        <rect class="xb-ttai" fill="#2a4080" width="240" height="36" rx="4" ry="4" />
        <rect class="xb-ttai-line1" fill="url(#ringGrad)" width="240" height="3" rx="1.5" y="4" opacity="0.9" />
        <rect class="xb-ttai-line2" fill="url(#ringGrad)" width="240" height="3" rx="1.5" y="29" opacity="0.6" />
      </g>
      <g class="xb-bar-group" transform="matrix(0 -1 1 0 66 200)" opacity="0.35">
        <rect class="xb-bar" fill="#3a60a0" width="40" height="280" rx="3" ry="3" />
        <rect class="xb-bar-glow" fill="#64b4ff" width="6" height="200" rx="3" x="17" y="20" opacity="0.5" />
      </g>
      <g transform="matrix(0 -1 1 0 30 230)">
        <circle cx="50" cy="50" r="50" fill="#0d1636" />
        <circle cx="50" cy="50" r="46" fill="#162850" opacity="0.8" />
        <circle class="xb-center-ring" cx="50" cy="50" r="42" fill="none" stroke="#64b4ff" stroke-width="2"
          opacity="0.7" filter="url(#glow)" />
        <circle cx="50" cy="50" r="34" fill="none" stroke="#4a90e2" stroke-width="1.2" opacity="0.45" />
        <line class="xb-x-line" x1="22" y1="22" x2="78" y2="78" stroke="#64b4ff" stroke-width="1.5" opacity="0.5" />
        <line class="xb-x-line" x1="78" y1="22" x2="22" y2="78" stroke="#64b4ff" stroke-width="1.5" opacity="0.5" />
        <circle class="xb-core" cx="50" cy="50" r="10" fill="#80c0ff" filter="url(#glow)" opacity="0.9" />
        <circle cx="50" cy="50" r="4" fill="#ffffff" />
      </g>
      <g class="xb-decor-group" transform="matrix(0 -1 1 0 38 222)" opacity="0.4">
        <circle cx="42" cy="42" r="40" fill="none" stroke="#4a90e2" stroke-width="1" />
        <circle cx="42" cy="42" r="32" fill="none" stroke="#64b4ff" stroke-width="0.6" stroke-dasharray="4 4" />
      </g>
    </svg>
    <div class="xbrain-text"><span>X</span>Brain</div>
  </a>
